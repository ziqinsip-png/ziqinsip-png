<style>
.bob{animation:bob 4.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(0.05)}97%{transform:scaleY(1)}}
.wave{transform-origin:252px 512px;animation:wave 1.8s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-7deg)}to{transform:rotate(11deg)}}
.sweep{transform-origin:518px 234px;animation:turn 4.5s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.float-a{animation:hover 5s ease-in-out infinite alternate}
.float-b{animation:hover 6.5s ease-in-out -2s infinite alternate}
.float-c{animation:hover 5.6s ease-in-out -1.2s infinite alternate}
@keyframes hover{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.pulse-2{animation:pulse 2.4s ease-in-out -1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.caret{animation:caret 1.1s steps(1) infinite}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
.dr2{animation:drift 8.5s ease-in-out -2.5s infinite alternate}
.dr3{animation:drift 6.2s ease-in-out -4s infinite alternate}
@keyframes drift{from{transform:translate(0,0);opacity:0.5}to{transform:translate(10px,-16px);opacity:0.15}}
.aur{animation:aur 11s ease-in-out infinite alternate}
.aur-b{animation:aur 14s ease-in-out -5s infinite alternate-reverse}
@keyframes aur{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
@media (prefers-reduced-motion: reduce){
.bob,.blink,.wave,.sweep,.float-a,.float-b,.float-c,.pulse,.pulse-2,.caret,.drift,.dr2,.dr3,.aur,.aur-b{animation:none !important;transform:none}
.drift,.dr2,.dr3{opacity:0.4}
}
</style>
