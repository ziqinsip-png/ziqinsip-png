<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" width="1000" height="16" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a45" stop-opacity="0"/>
      <stop offset=".55" stop-color="#ff6a45" stop-opacity=".18"/>
      <stop offset=".92" stop-color="#ff6a45" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff6a45" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .rule { stroke: #41443d; stroke-width: 1; }
    .run { animation: run 6000ms cubic-bezier(.65,.05,.36,1) infinite; }
    @keyframes run {
      0%   { transform: translateX(-360px); opacity: 0; }
      12%  { opacity: 1; }
      86%  { opacity: 1; }
      100% { transform: translateX(1000px); opacity: 0; }
    }
    .sig { animation: sig 2400ms ease-in-out infinite; opacity: .22; }
    .sig-2 { animation-delay: 260ms; }
    .sig-3 { animation-delay: 520ms; }
    @keyframes sig { 0%, 62% { opacity: .22; } 78% { opacity: 1; } 100% { opacity: .22; } }

    @media (prefers-reduced-motion: reduce) {
      .run { animation: none !important; transform: translateX(330px); opacity: 1; }
      .sig, .sig-2, .sig-3 { animation: none !important; opacity: .8; }
    }
  </style>
  <line class="rule" x1="0" y1="8" x2="1000" y2="8"/>
  <g class="run">
    <rect x="0" y="6" width="340" height="4" fill="url(#comet)"/>
    <rect x="330" y="5" width="6" height="6" fill="#ff6a45"/>
  </g>
  <g fill="#ff6a45">
    <circle class="sig" cx="962" cy="8" r="2.2"/>
    <circle class="sig sig-2" cx="974" cy="8" r="2.2"/>
    <circle class="sig sig-3" cx="986" cy="8" r="2.2"/>
  </g>
</svg>
