<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 16" width="1000" height="16" role="presentation" aria-hidden="true">
  <style>
    .rule { stroke: #c9c9be; stroke-width: 1; }
    .run { animation: run 6000ms cubic-bezier(.65,.05,.36,1) infinite; }
    @keyframes run {
      0%   { transform: translateX(-180px); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translateX(1000px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .run { animation: none !important; transform: translateX(410px); opacity: 1; }
    }
  </style>
  <line class="rule" x1="0" y1="8" x2="1000" y2="8"/>
  <g class="run">
    <rect x="0" y="6" width="120" height="4" fill="#e65132"/>
  </g>
</svg>
