<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 206" width="1000" height="206" role="img" aria-label="Tiga fokus yang sedang kukerjakan: keamanan aplikasi web, Python dan web development, serta hand tracking">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a45" stop-opacity="0"/>
      <stop offset=".55" stop-color="#ff6a45" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff6a45" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="trail-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b93ff" stop-opacity="0"/>
      <stop offset=".55" stop-color="#6b93ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6b93ff" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="trail-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0"/>
      <stop offset=".55" stop-color="#a3e635" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity=".92"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #eeede7; }
    .mut { fill: #94978d; }
    .acc { fill: #ff6a45; }
    .blu { fill: #6b93ff; }
    .grn { fill: #a3e635; }
    .rule { fill: #41443d; }

    .rise { animation-name: rise; animation-duration: 800ms; animation-timing-function: cubic-bezier(.2,.65,.3,1); animation-fill-mode: both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .r1 { animation-delay: 100ms; }
    .r2 { animation-delay: 220ms; }
    .r3 { animation-delay: 340ms; }

    .sweep { transform-box: fill-box; transform-origin: left center; animation: sweep 1100ms cubic-bezier(.2,.65,.3,1) 300ms both; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .glide { animation-name: glide; animation-duration: 4200ms; animation-timing-function: cubic-bezier(.5,0,.5,1); animation-iteration-count: infinite; animation-direction: alternate; }
    .grow { transform-box: fill-box; transform-origin: left center; animation-name: grow; animation-duration: 4200ms; animation-timing-function: cubic-bezier(.5,0,.5,1); animation-iteration-count: infinite; animation-direction: alternate; }
    .g2 { animation-duration: 5600ms; animation-delay: -1400ms; }
    .g3 { animation-duration: 3400ms; animation-delay: -2100ms; }
    @keyframes glide { from { transform: translateX(0); } to { transform: translateX(847px); } }
    @keyframes grow { from { transform: scaleX(.03); } to { transform: scaleX(1); } }

    .ico { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1300ms cubic-bezier(.2,.65,.3,1) both; }
    .ico-acc { stroke: #ff6a45; animation-delay: 480ms; }
    .ico-blu { stroke: #6b93ff; animation-delay: 620ms; }
    .ico-grn { stroke: #a3e635; animation-delay: 760ms; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .throb { animation: throb 2600ms ease-in-out infinite alternate; }
    .th2 { animation-duration: 3400ms; animation-delay: -900ms; }
    .th3 { animation-duration: 2900ms; animation-delay: -1700ms; }
    @keyframes throb { from { opacity: .3; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .r1, .r2, .r3 { animation: none !important; opacity: 1; transform: none; }
      .sweep { animation: none !important; transform: none; }
      .glide { animation: none !important; transform: translateX(423px); }
      .grow { animation: none !important; transform: scaleX(.5); }
      .ico { animation: none !important; stroke-dashoffset: 0; }
      .throb, .th2, .th3 { animation: none !important; opacity: .85; }
    }
  </style>

  <rect class="acc" x="40" y="5" width="8" height="11"/>
  <g class="mono mut rise" font-size="13" letter-spacing="2.4">
    <text x="60" y="16">03 / FOKUS YANG SEDANG KUKERJAKAN</text>
  </g>
  <rect class="rule sweep" x="428" y="10" width="532" height="1"/>

  <g class="rise r1">
    <text class="mono acc" x="40" y="64" font-size="14" letter-spacing="1">01</text>
    <path class="ico ico-acc" pathLength="100" d="M73 45 L82 48.5 V55 C82 61.5 78 65.5 73 67.5 C68 65.5 64 61.5 64 55 V48.5 Z M69 55.5 L72 58.5 L77.5 52.5"/>
    <text class="sans ink" x="110" y="64" font-size="24" letter-spacing="-.4">Keamanan aplikasi web</text>
    <text class="mono mut" x="960" y="62" font-size="14" text-anchor="end">merakit engine-nya sendiri</text>
    <rect class="rule" x="110" y="82" width="850" height="1"/>
    <g class="grow"><rect x="110" y="79" width="850" height="7" fill="url(#trail)"/></g>
    <g class="glide"><rect class="acc" x="110" y="73" width="3" height="19"/></g>
    <circle class="acc throb" cx="98" cy="59" r="2.4"/>
  </g>

  <g class="rise r2">
    <text class="mono blu" x="40" y="122" font-size="14" letter-spacing="1">02</text>
    <path class="ico ico-blu" pathLength="100" d="M68 105 L61 112 L68 119 M78 105 L85 112 L78 119 M74.5 103 L71.5 121"/>
    <text class="sans ink" x="110" y="122" font-size="24" letter-spacing="-.4">Python &amp; web development</text>
    <text class="mono mut" x="960" y="120" font-size="14" text-anchor="end">membangun, bukan cuma memakai</text>
    <rect class="rule" x="110" y="140" width="850" height="1"/>
    <g class="grow g2"><rect x="110" y="137" width="850" height="7" fill="url(#trail-b)"/></g>
    <g class="glide g2"><rect class="blu" x="110" y="131" width="3" height="19"/></g>
    <circle class="blu throb th2" cx="98" cy="117" r="2.4"/>
  </g>

  <g class="rise r3">
    <text class="mono grn" x="40" y="180" font-size="14" letter-spacing="1">03</text>
    <path class="ico ico-grn" pathLength="100" d="M67 165 A8.5 8.5 0 0 1 80 165 M62.5 160.5 A15 15 0 0 1 84.5 160.5"/>
    <circle class="grn" cx="73" cy="172" r="2.6"/>
    <text class="sans ink" x="110" y="180" font-size="24" letter-spacing="-.4">Hand tracking</text>
    <text class="mono mut" x="960" y="178" font-size="14" text-anchor="end">menyentuh layar tanpa menyentuhnya</text>
    <rect class="rule" x="110" y="198" width="850" height="1"/>
    <g class="grow g3"><rect x="110" y="195" width="850" height="7" fill="url(#trail-g)"/></g>
    <g class="glide g3"><rect class="grn" x="110" y="189" width="3" height="19"/></g>
    <circle class="grn throb th3" cx="98" cy="175" r="2.4"/>
  </g>
</svg>
