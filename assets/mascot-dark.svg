<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Maskot D A T Z: pemuda anime rambut perak bermata biru, melambaikan tangan di depan laptop dengan panel hologram">
<title>Maskot D A T Z</title>
<defs>
<linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f4f6fb"/><stop offset="1" stop-color="#c3c9d8"/>
</linearGradient>
<radialGradient id="iris" cx="0.35" cy="0.3" r="1">
<stop offset="0" stop-color="#8fb0ff"/><stop offset="0.55" stop-color="#6b93ff"/><stop offset="1" stop-color="#1b3f9e"/>
</radialGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1c2434"/><stop offset="1" stop-color="#14161a"/>
</linearGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
<clipPath id="frame"><rect x="10" y="10" width="620" height="780" rx="22"/></clipPath>
