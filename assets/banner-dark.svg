<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Ahmad Roziqin — D A T Z, mahasiswa Teknik Informatika FTIK Universitas Nusantara PGRI Kediri">
  <title>Ahmad Roziqin — D A T Z</title>
  <defs>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="862" cy="150" r="158">
      <stop offset="0" stop-color="#ff6a45" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#ff6a45" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff6a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beam" gradientUnits="userSpaceOnUse" cx="862" cy="150" r="88">
      <stop offset="0" stop-color="#ff6a45" stop-opacity=".40"/>
      <stop offset=".7" stop-color="#ff6a45" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff6a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a45"/>
      <stop offset=".55" stop-color="#ff6a45"/>
      <stop offset=".8" stop-color="#6b93ff"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a45" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6b93ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="rail"><rect x="40" y="252" width="700" height="40"/></clipPath>
    <clipPath id="frame"><rect width="1000" height="320"/></clipPath>
  </defs>
  <style>
    .bg { fill: #191b18; }
    .ink { fill: #eeede7; }
    .mut { fill: #94978d; }
    .acc { fill: #ff6a45; }
    .deep { fill: #ff8759; }
    .blu { fill: #6b93ff; }
    .grn { fill: #a3e635; }
    .amb { fill: #fbbf24; }
    .rule { fill: #41443d; }
    .hair { stroke: #41443d; stroke-width: 1; fill: none; }
    .ring { stroke: #41443d; stroke-width: 1; fill: none; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

    .fade { animation-name: fade; animation-duration: 700ms; animation-timing-function: ease-out; animation-fill-mode: both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .rise { animation: rise 900ms cubic-bezier(.2,.65,.3,1) both; }
    .d1 { animation-delay: 120ms; }
    .d2 { animation-delay: 240ms; }
    .d3 { animation-delay: 360ms; }
    .d4 { animation-delay: 520ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .sweep { transform-box: fill-box; transform-origin: left center; animation: sweep 1300ms cubic-bezier(.2,.65,.3,1) 400ms 1 both; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .turn { animation: turn 7s linear infinite; transform-origin: 862px 150px; }
    .turn-a { animation: turn 10s linear infinite; transform-origin: 862px 150px; }
    .turn-b { animation: turnb 16s linear infinite; transform-origin: 862px 150px; }
    .turn-c { animation: turn 23s linear infinite; transform-origin: 862px 150px; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes turnb { to { transform: rotate(-360deg); } }

    .breathe { animation: breathe 5200ms ease-in-out infinite alternate; transform-origin: 862px 150px; }
    @keyframes breathe { from { transform: scale(.97); } to { transform: scale(1.03); } }

    .pulse { animation: pulse 3200ms ease-in-out infinite alternate; }
    .pulse-2 { animation-duration: 4400ms; animation-delay: -1200ms; }
    .pulse-3 { animation-duration: 2600ms; animation-delay: -700ms; }
    @keyframes pulse { from { opacity: .25; } to { opacity: .95; } }

    .dash { stroke-dasharray: 5 11; animation: dash 24000ms linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -320; } }

    .rail { animation: rail 26000ms linear infinite; }
    @keyframes rail { from { transform: translateX(0); } to { transform: translateX(-900px); } }

    .caret { animation: blink 1100ms steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .aur { animation: aur 14000ms ease-in-out infinite alternate; }
    .aur-b { animation-duration: 19000ms; animation-delay: -6000ms; }
    @keyframes aur { from { transform: translateX(-46px); } to { transform: translateX(46px); } }

    .drift { animation: drift 9000ms ease-in-out infinite alternate; }
    .dr2 { animation-duration: 12000ms; animation-delay: -3000ms; }
    .dr3 { animation-duration: 7500ms; animation-delay: -5000ms; }
    .dr4 { animation-duration: 10500ms; animation-delay: -1500ms; }
    @keyframes drift { from { transform: translateY(0); opacity: .2; } 50% { opacity: .8; } to { transform: translateY(-14px); opacity: .2; } }

    .skyrun { animation: skyrun 9000ms cubic-bezier(.65,.05,.36,1) infinite; }
    @keyframes skyrun {
      0% { transform: translateX(-420px); opacity: 0; }
      14% { opacity: .9; }
      82% { opacity: .9; }
      100% { transform: translateX(1080px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .rise, .fade, .sweep, .turn, .turn-a, .turn-b, .turn-c, .breathe, .pulse, .pulse-2, .pulse-3, .dash, .rail, .caret, .aur, .aur-b, .drift, .dr2, .dr3, .dr4, .skyrun {
        animation: none !important;
        transform: none;
      }
      .rise, .fade, .sweep { opacity: 1; }
      .pulse, .pulse-2, .pulse-3 { opacity: .8; }
      .drift, .dr2, .dr3, .dr4 { opacity: .5; }
      .skyrun { opacity: 0; }
    }
  </style>

  <rect class="bg" width="1000" height="320"/>
  <g clip-path="url(#frame)">
