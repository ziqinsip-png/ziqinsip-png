    <ellipse class="aur aur-b" cx="660" cy="304" rx="400" ry="66" fill="#a3e635" opacity=".09" filter="url(#soft)"/>
    <ellipse class="aur" cx="540" cy="14" rx="300" ry="52" fill="#fbbf24" opacity=".07" filter="url(#soft)"/>
  </g>
  <rect width="1000" height="320" filter="url(#grain)" opacity=".05"/>

  <g class="hair" opacity=".85">
    <path class="dash" d="M0 13 H1000"/>
    <path class="dash" d="M0 307 H1000"/>
  </g>
  <g class="skyrun"><rect x="0" y="11" width="380" height="3" fill="url(#skyline)"/></g>

  <g>
    <circle class="blu drift" cx="96" cy="96" r="2.2"/>
    <circle class="acc drift dr2" cx="210" cy="238" r="2.6"/>
    <circle class="grn drift dr3" cx="352" cy="104" r="2"/>
    <circle class="amb drift dr4" cx="474" cy="230" r="2.4"/>
    <circle class="acc drift dr3" cx="598" cy="92" r="2.2"/>
    <circle class="blu drift dr2" cx="700" cy="214" r="2"/>
    <circle class="grn drift" cx="762" cy="66" r="1.8"/>
    <circle class="mut drift dr4" cx="160" cy="180" r="1.8"/>
    <circle class="amb drift dr2" cx="640" cy="160" r="1.6"/>
  </g>

  <g class="breathe">
    <circle cx="862" cy="150" r="150" fill="url(#halo)"/>
    <g class="turn fade">
      <path d="M862 150 L862 62 A88 88 0 0 1 938 106 Z" fill="url(#beam)"/>
      <path d="M862 150 V62" stroke="#ff6a45" stroke-width="1.6" fill="none" opacity=".85"/>
    </g>
    <g class="fade d2">
      <circle class="ring" cx="862" cy="150" r="88"/>
      <circle class="ring" cx="862" cy="150" r="58"/>
      <circle class="ring" cx="862" cy="150" r="28"/>
      <circle cx="862" cy="150" r="118" fill="none" stroke="#6b93ff" stroke-width="1" stroke-dasharray="2 9" opacity=".55"/>
      <path class="ring" d="M862 62 V238 M774 150 H950" opacity=".7"/>
    </g>
    <g class="fade d3">
      <circle class="acc" cx="862" cy="150" r="3.4"/>
      <circle class="acc pulse" cx="906" cy="112" r="3.4"/>
      <circle class="mut pulse-2" cx="826" cy="192" r="2.8"/>
      <circle class="grn pulse-3" cx="918" cy="170" r="2.4"/>
      <circle class="acc" cx="826" cy="192" r="1.2" opacity=".5"/>
    </g>
    <g class="turn-a"><circle class="acc" cx="862" cy="62" r="3.6" opacity=".9"/></g>
    <g class="turn-b"><circle class="mut" cx="920" cy="150" r="2.8"/></g>
    <g class="turn-c"><circle class="blu" cx="862" cy="32" r="2.6" opacity=".85"/></g>
    <g class="turn-b"><circle class="amb" cx="862" cy="208" r="2.2" opacity=".8"/></g>
  </g>

  <g class="fade">
    <rect class="acc" x="40" y="46" width="9" height="9"/>
    <g class="mono mut" font-size="15" letter-spacing="3">
      <text x="64" y="58">A PERSONAL FIELD NOTES / 2026</text>
    </g>
  </g>
  <g class="mono fade d1" font-size="14" letter-spacing="1.8" fill="#94978d">
    <text x="960" y="58" text-anchor="end">ziqintzy.my.id</text>
  </g>
  <rect class="acc caret" x="966" y="47" width="4" height="13"/>

  <g class="sans ink">
    <text class="rise d1" x="38" y="156" font-size="80" font-weight="700" letter-spacing="-3.4">AHMAD ROZIQIN</text>
  </g>
  <rect class="sweep" x="40" y="176" width="622" height="4" fill="url(#underline)"/>

  <g class="mono deep rise d2" font-size="17" letter-spacing="1.6">
    <text x="40" y="214">ALIAS / D A T Z</text>
  </g>
  <text class="mut rise d2" x="234" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16">Mahasiswa Teknik Informatika, FTIK UNP Kediri</text>

  <rect class="rule sweep" x="40" y="246" width="920" height="1" opacity=".9"/>

  <g clip-path="url(#rail)">
    <g class="rail fade d4">
      <g font-size="14" letter-spacing="1.2" text-anchor="middle">
        <g class="mono mut"><rect class="hair" x="40" y="260" width="172" height="28" rx="14"/><circle class="acc pulse" cx="58" cy="274" r="3"/><text x="132" y="279">WEB SECURITY</text></g>
        <g class="mono mut"><rect class="hair" x="222" y="260" width="172" height="28" rx="14"/><circle class="blu pulse-2" cx="240" cy="274" r="3"/><text x="314" y="279">PYTHON</text></g>
        <g class="mono mut"><rect class="hair" x="404" y="260" width="172" height="28" rx="14"/><circle class="grn pulse-3" cx="422" cy="274" r="3"/><text x="496" y="279">HAND TRACKING</text></g>
        <g class="mono mut"><rect class="hair" x="586" y="260" width="172" height="28" rx="14"/><circle class="amb pulse" cx="604" cy="274" r="3"/><text x="678" y="279">WEB DEVELOPMENT</text></g>
        <g class="mono mut"><rect class="hair" x="768" y="260" width="172" height="28" rx="14"/><circle class="acc pulse-2" cx="786" cy="274" r="3"/><text x="860" y="279">KEDIRI, ID</text></g>
      </g>
      <g transform="translate(900)" font-size="14" letter-spacing="1.2" text-anchor="middle">
        <g class="mono mut"><rect class="hair" x="40" y="260" width="172" height="28" rx="14"/><circle class="acc pulse" cx="58" cy="274" r="3"/><text x="132" y="279">WEB SECURITY</text></g>
        <g class="mono mut"><rect class="hair" x="222" y="260" width="172" height="28" rx="14"/><circle class="blu pulse-2" cx="240" cy="274" r="3"/><text x="314" y="279">PYTHON</text></g>
        <g class="mono mut"><rect class="hair" x="404" y="260" width="172" height="28" rx="14"/><circle class="grn pulse-3" cx="422" cy="274" r="3"/><text x="496" y="279">HAND TRACKING</text></g>
        <g class="mono mut"><rect class="hair" x="586" y="260" width="172" height="28" rx="14"/><circle class="amb pulse" cx="604" cy="274" r="3"/><text x="678" y="279">WEB DEVELOPMENT</text></g>
        <g class="mono mut"><rect class="hair" x="768" y="260" width="172" height="28" rx="14"/><circle class="acc pulse-2" cx="786" cy="274" r="3"/><text x="860" y="279">KEDIRI, ID</text></g>
      </g>
    </g>
  </g>

  <g class="mono mut fade d4" font-size="13" letter-spacing="1.2" opacity=".9">
    <text x="960" y="279" text-anchor="end">7.82° S / 112.03° E</text>
  </g>
</svg>
