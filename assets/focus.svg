<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 206" width="1000" height="206" role="img" aria-label="Tiga fokus yang sedang kukerjakan: keamanan aplikasi web, Python dan web development, serta hand tracking">
  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #191b18; }
    .mut { fill: #62645b; }
    .track { stroke: #c9c9be; stroke-width: 1; }
    .guide { stroke: #c9c9be; stroke-width: 1; stroke-dasharray: 2 6; }
    .tick { fill: #e65132; }
    .glide { animation: glide 4200ms cubic-bezier(.5,0,.5,1) infinite alternate; }
    .glide-2 { animation-duration: 5600ms; animation-delay: -1400ms; }
    .glide-3 { animation-duration: 3400ms; animation-delay: -2100ms; }
    @keyframes glide {
      from { transform: translateX(0); }
      to   { transform: translateX(390px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .glide, .glide-2, .glide-3 { animation: none !important; transform: translateX(195px); }
    }
  </style>

  <g class="mono mut" font-size="11" letter-spacing="3">
    <text x="0" y="16">03 / FOKUS YANG SEDANG KUKERJAKAN</text>
  </g>

  <g class="sans ink" font-size="23" letter-spacing="-.6">
    <text x="0" y="66">Keamanan aplikasi web</text>
    <text x="0" y="122">Python &amp; web development</text>
    <text x="0" y="178">Hand tracking</text>
  </g>

  <g class="mono mut" font-size="12">
    <text x="300" y="66">— memahami di mana risiko muncul</text>
    <text x="330" y="122">— membangun, bukan cuma memakai</text>
    <text x="212" y="178">— menggerakkan layar tanpa menyentuhnya</text>
  </g>

  <g>
    <line class="track" x1="570" y1="82" x2="1000" y2="82"/>
    <line class="track" x1="570" y1="138" x2="1000" y2="138"/>
    <line class="track" x1="570" y1="194" x2="1000" y2="194"/>
  </g>

  <g class="glide"><rect class="tick" x="570" y="78" width="26" height="8"/></g>
  <g class="glide glide-2"><rect class="tick" x="570" y="134" width="26" height="8"/></g>
  <g class="glide glide-3"><rect class="tick" x="570" y="190" width="26" height="8"/></g>
</svg>
