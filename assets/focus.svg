<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 206" width="1000" height="206" role="img" aria-label="Tiga fokus yang sedang kukerjakan: keamanan aplikasi web, Python dan web development, serta hand tracking">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e65132" stop-opacity="0"/>
      <stop offset=".55" stop-color="#e65132" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e65132" stop-opacity=".92"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #191b18; }
    .mut { fill: #62645b; }
    .acc { fill: #e65132; }
    .rule { fill: #c9c9be; }

    .rise { animation-name: rise; animation-duration: 800ms; animation-timing-function: cubic-bezier(.2,.65,.3,1); animation-fill-mode: both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .r1 { animation-delay: 100ms; }
    .r2 { animation-delay: 220ms; }
    .r3 { animation-delay: 340ms; }

    .sweep { transform-box: fill-box; transform-origin: left center; animation: sweep 1100ms cubic-bezier(.2,.65,.3,1) 300ms both; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .glide { animation-name: glide; animation-duration: 4200ms; animation-timing-function: cubic-bezier(.5,0,.5,1); animation-iteration-count: infinite; animation-direction: alternate; }
    .grow { transform-box: fill-box; transform-origin: left center; animation-name: grow; animation-duration: 4200ms; animation-timing-function: cubic-bezier(.5,0,.5,1); animation-iteration-count: infinite; animation-direction: alternate; }
    .g2 { animation-duration: 5600ms; animation-delay: -1400ms; }
    .g3 { animation-duration: 3400ms; animation-delay: -2100ms; }
    @keyframes glide { from { transform: translateX(0); } to { transform: translateX(873px); } }
    @keyframes grow { from { transform: scaleX(.03); } to { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .r1, .r2, .r3 { animation: none !important; opacity: 1; transform: none; }
      .sweep { animation: none !important; transform: none; }
      .glide { animation: none !important; transform: translateX(436px); }
      .grow { animation: none !important; transform: scaleX(.5); }
    }
  </style>

  <rect class="acc" x="40" y="5" width="8" height="11"/>
  <g class="mono mut rise" font-size="13" letter-spacing="2.4">
    <text x="60" y="16">03 / FOKUS YANG SEDANG KUKERJAKAN</text>
  </g>
  <rect class="rule sweep" x="428" y="10" width="532" height="1"/>

  <g class="rise r1">
    <text class="mono acc" x="40" y="64" font-size="14" letter-spacing="1">01</text>
    <text class="sans ink" x="84" y="64" font-size="24" letter-spacing="-.4">Keamanan aplikasi web</text>
    <text class="mono mut" x="960" y="62" font-size="14" text-anchor="end">merakit engine-nya sendiri</text>
    <rect class="rule" x="84" y="82" width="876" height="1"/>
    <g class="grow"><rect x="84" y="79" width="876" height="7" fill="url(#trail)"/></g>
    <g class="glide"><rect class="acc" x="84" y="73" width="3" height="19"/></g>
  </g>

  <g class="rise r2">
    <text class="mono acc" x="40" y="122" font-size="14" letter-spacing="1">02</text>
    <text class="sans ink" x="84" y="122" font-size="24" letter-spacing="-.4">Python &amp; web development</text>
    <text class="mono mut" x="960" y="120" font-size="14" text-anchor="end">membangun, bukan cuma memakai</text>
    <rect class="rule" x="84" y="140" width="876" height="1"/>
    <g class="grow g2"><rect x="84" y="137" width="876" height="7" fill="url(#trail)"/></g>
    <g class="glide g2"><rect class="acc" x="84" y="131" width="3" height="19"/></g>
  </g>

  <g class="rise r3">
    <text class="mono acc" x="40" y="180" font-size="14" letter-spacing="1">03</text>
    <text class="sans ink" x="84" y="180" font-size="24" letter-spacing="-.4">Hand tracking</text>
    <text class="mono mut" x="960" y="178" font-size="14" text-anchor="end">menyentuh layar tanpa menyentuhnya</text>
    <rect class="rule" x="84" y="198" width="876" height="1"/>
    <g class="grow g3"><rect x="84" y="195" width="876" height="7" fill="url(#trail)"/></g>
    <g class="glide g3"><rect class="acc" x="84" y="189" width="3" height="19"/></g>
  </g>
</svg>
