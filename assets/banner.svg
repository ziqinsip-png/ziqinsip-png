<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Ahmad Roziqin — D A T Z, mahasiswa Teknik Informatika FTIK Universitas Nusantara PGRI Kediri">
  <title>Ahmad Roziqin — D A T Z</title>
  <defs>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="862" cy="150" r="158">
      <stop offset="0" stop-color="#e65132" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#e65132" stop-opacity=".14"/>
      <stop offset="1" stop-color="#e65132" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beam" gradientUnits="userSpaceOnUse" cx="862" cy="150" r="88">
      <stop offset="0" stop-color="#e65132" stop-opacity=".40"/>
      <stop offset=".7" stop-color="#e65132" stop-opacity=".14"/>
      <stop offset="1" stop-color="#e65132" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="rail"><rect x="40" y="252" width="700" height="40"/></clipPath>
  </defs>
  <style>
    .bg { fill: #eeede7; }
    .ink { fill: #191b18; }
    .mut { fill: #62645b; }
    .acc { fill: #e65132; }
    .deep { fill: #aa341e; }
    .rule { fill: #c9c9be; }
    .hair { stroke: #c9c9be; stroke-width: 1; fill: none; }
    .ring { stroke: #c9c9be; stroke-width: 1; fill: none; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

    .fade { animation-name: fade; animation-duration: 700ms; animation-timing-function: ease-out; animation-fill-mode: both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    .rise { animation: rise 900ms cubic-bezier(.2,.65,.3,1) both; }
    .d1 { animation-delay: 120ms; }
    .d2 { animation-delay: 240ms; }
    .d3 { animation-delay: 360ms; }
    .d4 { animation-delay: 520ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .sweep { transform-box: fill-box; transform-origin: left center; animation: sweep 1300ms cubic-bezier(.2,.65,.3,1) 400ms 1 both; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .turn { animation: turn 7s linear infinite; transform-origin: 862px 150px; }
    .turn-a { animation: turn 10s linear infinite; transform-origin: 862px 150px; }
    .turn-b { animation: turnb 16s linear infinite; transform-origin: 862px 150px; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes turnb { to { transform: rotate(-360deg); } }

    .breathe { animation: breathe 5200ms ease-in-out infinite alternate; transform-origin: 862px 150px; }
    @keyframes breathe { from { transform: scale(.97); } to { transform: scale(1.03); } }

    .pulse { animation: pulse 3200ms ease-in-out infinite alternate; }
    .pulse-2 { animation-duration: 4400ms; animation-delay: -1200ms; }
    @keyframes pulse { from { opacity: .25; } to { opacity: .95; } }

    .dash { stroke-dasharray: 5 11; animation: dash 24000ms linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -320; } }

    .rail { animation: rail 26000ms linear infinite; }
    @keyframes rail { from { transform: translateX(0); } to { transform: translateX(-900px); } }

    .caret { animation: blink 1100ms steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .fade, .sweep, .turn, .turn-a, .turn-b, .breathe, .pulse, .pulse-2, .dash, .rail, .caret {
        animation: none !important;
        opacity: 1;
        transform: none;
      }
      .fade, .pulse, .pulse-2 { opacity: .8; }
    }
  </style>

  <rect class="bg" width="1000" height="320"/>
  <rect width="1000" height="320" filter="url(#grain)" opacity=".05"/>

  <g class="hair" opacity=".85">
    <path class="dash" d="M0 13 H1000"/>
    <path class="dash" d="M0 307 H1000"/>
  </g>

  <g class="breathe">
    <circle cx="862" cy="150" r="150" fill="url(#halo)"/>
    <g class="turn fade">
      <path d="M862 150 L862 62 A88 88 0 0 1 938 106 Z" fill="url(#beam)"/>
      <path d="M862 150 V62" stroke="#e65132" stroke-width="1.6" fill="none" opacity=".85"/>
    </g>
    <g class="fade d2">
      <circle class="ring" cx="862" cy="150" r="88"/>
      <circle class="ring" cx="862" cy="150" r="58"/>
      <circle class="ring" cx="862" cy="150" r="28"/>
      <path class="ring" d="M862 62 V238 M774 150 H950" opacity=".7"/>
    </g>
    <g class="fade d3">
      <circle class="acc" cx="862" cy="150" r="3.4"/>
      <circle class="acc pulse" cx="906" cy="112" r="3.4"/>
      <circle class="mut pulse-2" cx="826" cy="192" r="2.8"/>
      <circle class="acc" cx="826" cy="192" r="1.2" opacity=".5"/>
    </g>
    <g class="turn-a"><circle class="acc" cx="862" cy="62" r="3.6" opacity=".9"/></g>
    <g class="turn-b"><circle class="mut" cx="920" cy="150" r="2.8"/></g>
  </g>

  <g class="fade">
    <rect class="acc" x="40" y="46" width="9" height="9"/>
    <g class="mono mut" font-size="15" letter-spacing="3">
      <text x="64" y="58">A PERSONAL FIELD NOTES / 2026</text>
    </g>
  </g>
  <g class="mono fade d1" font-size="14" letter-spacing="1.8" fill="#62645b">
    <text x="960" y="58" text-anchor="end">ziqintzy.my.id</text>
  </g>
  <rect class="acc caret" x="966" y="47" width="4" height="13"/>

  <g class="sans ink">
    <text class="rise d1" x="38" y="156" font-size="80" font-weight="700" letter-spacing="-3.4">AHMAD ROZIQIN</text>
  </g>
  <rect class="acc sweep" x="40" y="176" width="622" height="4"/>

  <g class="mono deep rise d2" font-size="17" letter-spacing="1.6">
    <text x="40" y="214">ALIAS / D A T Z</text>
  </g>
  <text class="mut rise d2" x="234" y="214" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16">Mahasiswa Teknik Informatika, FTIK UNP Kediri</text>

  <rect class="rule sweep" x="40" y="246" width="920" height="1" opacity=".9"/>

  <g clip-path="url(#rail)">
    <g class="rail fade d4">
      <g font-size="14" letter-spacing="1.2" text-anchor="middle">
        <g class="mono mut"><rect class="hair" x="40" y="260" width="172" height="28" rx="14"/><text x="126" y="279">WEB SECURITY</text></g>
        <g class="mono mut"><rect class="hair" x="222" y="260" width="172" height="28" rx="14"/><text x="308" y="279">PYTHON</text></g>
        <g class="mono mut"><rect class="hair" x="404" y="260" width="172" height="28" rx="14"/><text x="490" y="279">HAND TRACKING</text></g>
        <g class="mono mut"><rect class="hair" x="586" y="260" width="172" height="28" rx="14"/><text x="672" y="279">WEB DEVELOPMENT</text></g>
        <g class="mono mut"><rect class="hair" x="768" y="260" width="172" height="28" rx="14"/><text x="854" y="279">KEDIRI, ID</text></g>
      </g>
      <g transform="translate(900)" font-size="14" letter-spacing="1.2" text-anchor="middle">
        <g class="mono mut"><rect class="hair" x="40" y="260" width="172" height="28" rx="14"/><text x="126" y="279">WEB SECURITY</text></g>
        <g class="mono mut"><rect class="hair" x="222" y="260" width="172" height="28" rx="14"/><text x="308" y="279">PYTHON</text></g>
        <g class="mono mut"><rect class="hair" x="404" y="260" width="172" height="28" rx="14"/><text x="490" y="279">HAND TRACKING</text></g>
        <g class="mono mut"><rect class="hair" x="586" y="260" width="172" height="28" rx="14"/><text x="672" y="279">WEB DEVELOPMENT</text></g>
        <g class="mono mut"><rect class="hair" x="768" y="260" width="172" height="28" rx="14"/><text x="854" y="279">KEDIRI, ID</text></g>
      </g>
    </g>
  </g>

  <g class="mono mut fade d4" font-size="13" letter-spacing="1.2" opacity=".9">
    <text x="960" y="279" text-anchor="end">7.82° S / 112.03° E</text>
  </g>
</svg>
