<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-label="Tanda tangan D A T Z dengan tulisan stay curious">
  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ink { fill: #191b18; }
    .mut { fill: #62645b; }
    .acc { fill: #e65132; }
    .rule { fill: #c9c9be; }

    .rise { animation-name: rise; animation-duration: 900ms; animation-timing-function: cubic-bezier(.2,.65,.3,1); animation-fill-mode: both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .r2 { animation-delay: 90ms; }
    .r3 { animation-delay: 180ms; }
    .r4 { animation-delay: 270ms; }
    .r5 { animation-delay: 420ms; }
    .r6 { animation-delay: 620ms; }

    .draw { animation: draw 1100ms cubic-bezier(.2,.65,.3,1) 480ms both; }
    @keyframes draw { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }

    .sweep { transform-box: fill-box; transform-origin: left center; animation: sweep 1400ms cubic-bezier(.2,.65,.3,1) 620ms both; }
    @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .spin { animation: spin 8000ms linear infinite; transform-origin: 326px 96px; }
    .spin-b { animation: spinb 13000ms linear infinite; transform-origin: 326px 96px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinb { to { transform: rotate(-360deg); } }

    .caret { animation: blink 1100ms steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .tw { animation: tw 3600ms ease-in-out infinite alternate; }
    .tw2 { animation-duration: 4700ms; animation-delay: -1300ms; }
    .tw3 { animation-duration: 2900ms; animation-delay: -2200ms; }
    @keyframes tw { from { opacity: .15; transform: translateY(0); } 50% { opacity: .75; } to { opacity: .15; transform: translateY(-8px); } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .draw, .sweep, .spin, .spin-b, .caret, .tw, .tw2, .tw3 {
        animation: none !important;
        opacity: 1;
        transform: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

  <rect class="acc" x="40" y="12" width="7" height="10"/>
  <g class="mono mut rise" font-size="12" letter-spacing="2.6">
    <text x="58" y="22">TANDA TANGAN</text>
  </g>

  <g class="sans ink" font-size="84" font-weight="700">
    <text class="rise" x="40" y="104">D</text>
    <text class="rise r2" x="112" y="104">A</text>
    <text class="rise r3" x="186" y="104">T</text>
    <text class="rise r4" x="250" y="104">Z</text>
    <text class="rise r5 acc" x="312" y="104">.</text>
  </g>
  <path class="draw" d="M40 122 H340" stroke="#e65132" stroke-width="3" fill="none" stroke-dasharray="300"/>

  <g class="rise r6">
    <circle cx="326" cy="96" r="36" fill="none" stroke="#e65132" stroke-width="1.2" opacity=".45"/>
    <circle cx="326" cy="96" r="44" fill="none" stroke="#2f6bff" stroke-width="1" stroke-dasharray="2 8" opacity=".4"/>
    <g class="spin"><circle cx="326" cy="60" r="3.4" fill="#e65132"/></g>
    <g class="spin-b"><circle cx="326" cy="52" r="2.4" fill="#2f6bff" opacity=".85"/></g>
  </g>

  <g>
    <circle class="tw" cx="452" cy="40" r="2" fill="#e65132"/>
    <circle class="tw tw2" cx="596" cy="58" r="2.2" fill="#2f6bff"/>
    <circle class="tw tw3" cx="724" cy="34" r="1.8" fill="#3f8f0f"/>
    <circle class="tw tw2" cx="838" cy="66" r="2" fill="#c77400"/>
    <circle class="tw tw3" cx="520" cy="116" r="1.6" fill="#3f8f0f"/>
  </g>

  <rect class="rule sweep" x="380" y="97" width="418" height="1"/>

  <g class="mono mut rise r6" font-size="15" letter-spacing="2.4">
    <text x="960" y="104" text-anchor="end">STAY CURIOUS.</text>
  </g>
  <rect class="acc caret" x="966" y="92" width="4" height="14"/>
</svg>
